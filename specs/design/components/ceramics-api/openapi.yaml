openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: >
    Catalog, cart, checkout, and order management for the handmade-ceramics
    store.
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a product (seller only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProduct
      summary: Get a product's detail
      security: []
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProduct
      summary: Replace a product (seller only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProduct
      summary: Delete a product (seller only)
      responses:
        '204': { description: Product deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/stock:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: adjustProductStock
      summary: Adjust a product's stock quantity (seller only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta: { type: integer, description: signed change to apply to stock quantity }
      responses:
        '200':
          description: Updated product with new stock quantity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cart:
    get:
      operationId: getCart
      summary: Get the caller's cart
      responses:
        '200':
          description: The caller's cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cart/items:
    post:
      operationId: addCartItem
      summary: Add a product to the caller's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /cart/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateCartItem
      summary: Update a cart line item's quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cart with updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeCartItem
      summary: Remove a line item from the cart
      responses:
        '204': { description: Item removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cart/checkout:
    post:
      operationId: checkoutCart
      summary: Validate stock, charge payment, and create an order from the cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created and payment captured
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Stock insufficient or payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    get:
      operationId: listOrders
      summary: List orders (own orders for a shopper; all orders for the seller)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrder
      summary: Get an order's detail
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: updateOrderStatus
      summary: Update an order's fulfillment status (seller only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: Order with updated status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe
      security: []
      responses:
        '200': { description: Service is healthy }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Caller's opaque IdP subject, injected by the gateway.
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Business rule violation (e.g. stock insufficient)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

    Product:
      type: object
      required: [id, name, price, category, stockQuantity, published]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        images:
          type: array
          items: { type: string, format: uri }
        category: { type: string }
        stockQuantity: { type: integer }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, price, category, stockQuantity]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        images:
          type: array
          items: { type: string, format: uri }
        category: { type: string }
        stockQuantity: { type: integer }
        published: { type: boolean, default: false }

    CartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        productName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }

    Cart:
      type: object
      required: [items, subtotal]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: number }

    Address:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }

    CheckoutRequest:
      type: object
      required: [shippingAddress, paymentMethodToken]
      properties:
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentMethodToken:
          type: string
          description: payment-provider token representing the shopper's payment method

    OrderStatus:
      type: string
      enum: [pending, processing, shipped, delivered, cancelled]

    OrderLineItem:
      type: object
      required: [productId, productName, unitPrice, quantity, lineTotal]
      properties:
        productId: { type: string }
        productName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }

    Order:
      type: object
      required: [id, status, items, subtotal, shippingFee, total, shippingAddress, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderLineItem' }
        subtotal: { type: number }
        shippingFee: { type: number }
        tax: { type: number }
        total: { type: number }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentStatus: { type: string }
        createdAt: { type: string, format: date-time }
